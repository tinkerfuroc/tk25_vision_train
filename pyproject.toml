[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tk_vision"
version = "0.1.0"
description = "SAM3-driven semi-automatic segmentation pipeline with web UI for Robocup vision."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tinker Furo" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy<2.0",
    "opencv-python>=4.10",
    "pillow>=10",
    "pycocotools>=2.0.7",
    "thefuzz[speedup]>=0.22",
    "supervision>=0.25",
    "ultralytics>=8.3",
    "transformers>=4.57",
    "torch>=2.5",
    "torchvision",
    "matplotlib",
    "pandas",
    "albumentations>=1.4",
    "joblib>=1.3",
    "pyrealsense2>=2.56",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
tk_vision = "tk_vision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["server/tk_vision"]

[tool.hatch.build.targets.sdist]
include = ["server/tk_vision", "configs", "resource", "web/dist"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
